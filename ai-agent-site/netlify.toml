# Netlify Drop / static deploy — no build step
[build]
  publish = "."

[[redirects]]
  from = "/open"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/open/"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/open/index.html"
  to = "/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
