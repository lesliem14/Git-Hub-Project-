<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>idecompiler — Solidity IDE</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="ide.css" />
  <script>
    (function () {
      function hide() {
        var el = document.getElementById("ide-loader");
        if (el) el.classList.add("hidden");
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", hide);
      } else {
        hide();
      }
      setTimeout(hide, 2500);
    })();
  </script>
</head>
<body>
  <div id="ide-loader" class="ide-loader">
    <div class="ide-loader-inner">
      <div class="ide-loader-spinner"></div>
      <p class="ide-loader-text">Initializing Compiler v0.08.6</p>
    </div>
  </div>

  <div class="ide-app">
    <header class="ide-topbar">
      <div class="ide-topbar-left">
        <a href="../index.html" class="ide-back">← Guide</a>
        <span class="ide-brand">idecompiler</span>
        <span class="ide-path">s3.amazonaws.com/idecompiler/open</span>
      </div>
      <div class="ide-topbar-right">
        <button type="button" class="ide-icon-btn" id="btn-compile" title="Compile">Compile</button>
        <button type="button" class="ide-icon-btn" id="btn-theme" title="Theme">☀</button>
      </div>
    </header>

    <div class="ide-body">
      <aside class="ide-sidebar ide-sidebar-left">
        <div class="ide-panel-head">Deploy &amp; Run</div>
        <div class="ide-deploy-scroll">
          <div class="ide-deploy-section">
            <div class="ide-deploy-label">ENVIRONMENT</div>
            <div class="ide-deploy-value">Injected Provider - MetaMask</div>
          </div>
          <div class="ide-deploy-section">
            <div class="ide-deploy-label">ACCOUNT</div>
            <div class="ide-deploy-value mono" id="deploy-account">0x3782…f055 (0 ETH)</div>
          </div>
          <div class="ide-deploy-section">
            <div class="ide-deploy-label">CONTRACT</div>
            <select class="ide-select" id="deploy-contract">
              <option value="">— Select compiled contract —</option>
            </select>
            <button type="button" class="ide-btn-deploy" id="btn-secure-deploy">Secure Deploy</button>
          </div>
          <div class="ide-deployed-card hidden" id="deployed-card">
            <div class="ide-deployed-title">DEPLOYED CONTRACTS</div>
            <div class="ide-deployed-row">
              <span class="mono" id="deployed-label">ExampleContract</span>
              <button type="button" class="ide-copy-addr" id="btn-copy-address">Copy Address</button>
            </div>
            <div class="ide-deploy-actions">
              <button type="button" class="ide-action-btn" id="btn-start">Start</button>
              <button type="button" class="ide-action-btn" id="btn-withdraw">Withdraw</button>
              <button type="button" class="ide-action-btn" id="btn-balance">Get Balance</button>
            </div>
          </div>
        </div>
      </aside>

      <aside class="ide-sidebar ide-sidebar-mid">
        <div class="ide-panel-head">File Explorer</div>
        <div class="ide-tree-toolbar">
          <button type="button" class="ide-tree-btn" id="btn-new-file">New File</button>
          <button type="button" class="ide-tree-btn" id="btn-new-folder">New Folder</button>
        </div>
        <div class="ide-tree" id="file-tree"></div>
        <div class="ide-panel-head ide-panel-sub">Solidity Compiler</div>
        <div class="ide-compiler-mini">
          <label>Compiler</label>
          <select id="compiler-version"><option>0.8.6+commit.1159f9de</option></select>
          <button type="button" class="ide-btn-compile-mini" id="btn-compile-sidebar">Compile</button>
        </div>
      </aside>

      <main class="ide-editor-wrap">
        <div class="ide-tabs" id="editor-tabs"></div>
        <textarea class="ide-editor" id="editor" spellcheck="false"></textarea>
      </main>
    </div>

    <footer class="ide-terminal-wrap">
      <div class="ide-terminal-head">
        <span>Terminal</span>
        <button type="button" class="ide-term-clear" id="btn-clear-terminal">Clear</button>
      </div>
      <div class="ide-terminal" id="terminal"></div>
    </footer>
  </div>

  <script src="../contract.js"></script>
  <script src="ide.js"></script>
</body>
</html>
