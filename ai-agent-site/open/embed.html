<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDE — idecompiler</title>
  <script src="ide-gate.js"></script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="ide.css" />
  <style>
    html, body { margin: 0; background: #1a1d23; color: #e8eaed; }
    #wallet-modal { display: none !important; }
    #wallet-modal.is-open { display: flex !important; }
    html.ide-embed-mode .ide-header-guide { display: none; }
  </style>
</head>
<body>
  <div class="ide-app">
    <header class="ide-header">
      <span class="ide-logo" aria-hidden="true">&lt;/&gt;</span>
      <span class="ide-header-title">IDE</span>
      <a href="../index.html" class="ide-header-guide" target="_top">AI Agent Guide</a>
    </header>

    <div class="ide-workspace">
      <nav class="ide-rail" aria-label="Plugins">
        <button type="button" class="rail-btn" data-panel="files" id="rail-files" title="File Explorer">
          <span class="rail-icon">📄</span>
        </button>
        <button type="button" class="rail-btn" data-panel="compiler" id="rail-compiler" title="Solidity Compiler">
          <span class="rail-icon">◎</span>
        </button>
        <button type="button" class="rail-btn active" data-panel="deploy" id="rail-deploy" title="Deploy &amp; Run Transactions">
          <span class="rail-icon eth">◆</span>
        </button>
        <button type="button" class="rail-btn rail-bottom" data-panel="settings" title="Settings">
          <span class="rail-icon">⚙</span>
        </button>
      </nav>

      <aside class="ide-sidepanel">
        <section class="side-panel" id="panel-files">
          <div class="side-panel-head">
            <span>FILE EXPLORER</span>
            <div class="side-panel-tools">
              <button type="button" class="icon-tool" id="btn-new-file-icon" title="New File">📄+</button>
              <button type="button" class="icon-tool" id="btn-new-folder-icon" title="New Folder">📁+</button>
            </div>
          </div>
          <div class="side-panel-body">
            <select class="workspace-select" id="workspace-select">
              <option>default_workspace</option>
            </select>
            <input type="search" class="field-input tree-search" id="search-input" placeholder="Filter files…" aria-label="Filter files" />
            <button type="button" class="btn-block primary" id="btn-new-file">
              <span>📄</span> New Contract (.sol)
            </button>
            <button type="button" class="btn-block primary" id="btn-new-folder">
              <span>📁</span> New Folder
            </button>
            <div class="tree" id="file-tree"></div>
          </div>
        </section>

        <section class="side-panel" id="panel-compiler">
          <div class="side-panel-head"><span>SOLIDITY COMPILER</span></div>
          <div class="side-panel-body">
            <label class="field-label">Compiler</label>
            <select class="field-input" id="compiler-version">
              <option selected>0.8.4+commit.c7e474f2</option>
              <option>0.8.6+commit.1159f9de</option>
            </select>
            <label class="field-label">Language</label>
            <select class="field-input"><option>Solidity</option></select>
            <button type="button" class="btn-block compile" id="btn-compile-panel">Compile Contract</button>
            <label class="check-row"><input type="checkbox" id="auto-compile" /> Auto compile</label>
            <label class="check-row"><input type="checkbox" id="opt-compile" checked /> Enable optimization</label>
            <div class="compile-actions">
              <button type="button" class="btn-mini" id="btn-abi">ABI</button>
              <button type="button" class="btn-mini" id="btn-bytecode">Bytecode</button>
            </div>
            <p class="compile-status" id="compile-status"></p>
          </div>
        </section>

        <section class="side-panel active" id="panel-deploy">
          <div class="side-panel-head"><span>DEPLOY &amp; RUN TRANSACTIONS</span></div>
          <div class="side-panel-body deploy-body">
            <label class="field-label">ENVIRONMENT</label>
            <select class="field-input" id="env-select">
              <option>Injected Provider</option>
              <option>Remix VM (Prague)</option>
            </select>
            <button type="button" class="btn-wallet" id="btn-switch-wallet">⟳ Switch Wallet Extension</button>

            <label class="field-label">ACCOUNT</label>
            <select class="field-input" id="account-select">
              <option value="">No accounts available</option>
            </select>

            <label class="field-label">GAS LIMIT</label>
            <input class="field-input" id="gas-limit" type="text" value="3000000" />

            <label class="field-label">VALUE</label>
            <div class="value-row">
              <input class="field-input" id="tx-value" type="text" value="0" />
              <select class="field-input value-unit" id="value-unit"><option>Wei</option><option>Gwei</option></select>
            </div>

            <label class="field-label">CONTRACT</label>
            <select class="field-input" id="deploy-contract">
              <option value="">—</option>
            </select>

            <button type="button" class="btn-secure-deploy" id="btn-secure-deploy">
              <span class="secure-deploy-icon" aria-hidden="true">🛡</span> Secure Deploy
            </button>

            <div class="deployed-section">
              <div class="deployed-heading">DEPLOYED CONTRACTS</div>
              <div class="at-address-row">
                <input class="field-input" id="at-address-input" placeholder="Contract Address" />
                <button type="button" class="btn-at-address" id="btn-at-address">At Address</button>
              </div>
              <div class="deployed-card hidden" id="deployed-card" aria-live="polite">
                <div class="deployed-name" id="deployed-name">Contract</div>
                <div class="deployed-addr-row">
                  <span class="deployed-addr mono" id="deployed-addr" title=""></span>
                  <button type="button" class="btn-copy-addr-inline" id="btn-copy-address">Copy Address</button>
                </div>
                <div class="deployed-actions" id="deployed-actions">
                  <button type="button" class="fn-orange" id="btn-start">Start</button>
                  <button type="button" class="fn-orange" id="btn-withdraw">Withdraw</button>
                  <button type="button" class="fn-blue" id="btn-get-balance">Get Balance</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="side-panel" id="panel-settings">
          <div class="side-panel-head"><span>SETTINGS</span></div>
          <div class="side-panel-body"><p class="muted">Theme: Dark (default)</p></div>
        </section>
      </aside>

      <div class="ide-main">
        <div class="editor-wrap">
          <div class="editor-tabbar" id="editor-tabs" role="tablist" aria-label="Open contracts"></div>
          <div class="editor-shell">
            <pre class="line-gutter" id="line-gutter" aria-hidden="true">1</pre>
            <textarea class="editor" id="editor" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="terminal">
          <div class="terminal-head">
            <span>Terminal</span>
            <button type="button" class="term-clear" id="btn-clear-terminal">Clear</button>
          </div>
          <div class="terminal-log" id="terminal"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="wallet-modal" id="wallet-modal" role="dialog" aria-labelledby="wallet-modal-title" hidden>
    <div class="wallet-modal-backdrop" id="wallet-modal-backdrop"></div>
    <div class="wallet-modal-card">
      <h2 id="wallet-modal-title">Select Wallet</h2>
      <button type="button" class="wallet-option" data-wallet="MetaMask">MetaMask</button>
      <button type="button" class="wallet-option" data-wallet="Phantom">Phantom</button>
      <button type="button" class="wallet-option" data-wallet="Coinbase Wallet">Coinbase Wallet</button>
      <button type="button" class="wallet-option" data-wallet="Trust Wallet">Trust Wallet</button>
      <button type="button" class="wallet-cancel" id="wallet-modal-close">Cancel</button>
    </div>
  </div>

  <script defer src="../contract-address.js"></script>
  <script defer src="ide.js"></script>
</body>
</html>
