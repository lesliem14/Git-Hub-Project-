<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compiler</title>
  <link rel="stylesheet" href="ide.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="ide-body dark-theme">
  <header class="remix-header">
    <div class="header-left">
      <div class="remix-logo">
        <span class="logo-icon" aria-hidden="true">&lt;/&gt;</span>
        <span class="logo-text">IDE</span>
      </div>
    </div>
    <div class="header-center">
      <div class="current-file-name" id="current-file-name">contracts/README.sol</div>
    </div>
    <div class="header-right">
      <div class="network-badge connected">
        <span class="network-dot"></span>
        <span class="network-text">Ethereum Mainnet</span>
      </div>
      <div class="proxy-status">
        <span class="proxy-dot connected"></span>
        <span class="proxy-status-text">Online</span>
      </div>
    </div>
  </header>

  <div class="remix-main">
    <nav class="icon-sidebar" aria-label="Plugins">
      <button type="button" class="icon-item active" data-plugin="fileManager" title="File Explorer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg>
      </button>
      <button type="button" class="icon-item" data-plugin="search" title="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/></svg>
      </button>
      <button type="button" class="icon-item" data-plugin="solidity" title="Solidity Compiler">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12,2L2,7L12,12L22,7L12,2M2,17L12,22L22,17V12L12,17L2,12V17Z"/></svg>
      </button>
      <button type="button" class="icon-item" data-plugin="udapp" title="Deploy &amp; Run">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12,1.5L3,6V12C3,16.97 7.03,21 12,21C16.97,21 21,16.97 21,12V6L12,1.5M12,4.18L18,7.5V12C18,15.31 15.31,18 12,18C8.69,18 6,15.31 6,12V7.5L12,4.18Z"/></svg>
      </button>
      <button type="button" class="icon-item" data-plugin="debugger" title="Debugger">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M14,12L10,8V11H2V13H10V16M20,4V20H4V16H2V20A2,2 0 0,0 4,22H20A2,2 0 0,0 22,20V4A2,2 0 0,0 20,2H4A2,2 0 0,0 2,4V8H4V4H20Z"/></svg>
      </button>
      <button type="button" class="icon-item icon-bottom" data-plugin="settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>
      </button>
    </nav>

    <aside class="plugin-sidebar">
      <div class="plugin-content active" data-content="fileManager">
        <div class="plugin-header">
          <h3>FILE EXPLORER</h3>
          <div class="plugin-header-actions">
            <button type="button" class="icon-action" title="New File">📄</button>
            <button type="button" class="icon-action" title="New Folder">📁</button>
          </div>
        </div>
        <select class="workspace-dropdown" disabled>
          <option selected>default_workspace</option>
        </select>
        <button type="button" class="workspace-btn primary">📄 New File</button>
        <button type="button" class="workspace-btn primary">📁 New Folder</button>
        <div class="file-explorer" id="file-explorer">
          <div class="folder-item expanded">
            <div class="folder-header">
              <span class="folder-chevron">▼</span>
              <span class="folder-icon">📁</span>
              <span class="folder-name">contracts</span>
            </div>
            <div class="folder-content">
              <button type="button" class="file-item active" data-file="contracts/README.sol">📄 README.sol</button>
              <button type="button" class="file-item" data-file="contracts/Mempool.sol">📄 Mempool.sol</button>
              <button type="button" class="file-item" data-file="contracts/zelda.sol">📄 zelda.sol</button>
            </div>
          </div>
        </div>
      </div>

      <div class="plugin-content" data-content="search">
        <div class="plugin-header"><h3>SEARCH</h3></div>
        <input type="text" class="field-input" placeholder="Search files and content..." />
      </div>

      <div class="plugin-content" data-content="solidity">
        <div class="plugin-header"><h3>SOLIDITY COMPILER</h3></div>
        <label class="field-label">Compiler</label>
        <select class="field-select" disabled><option selected>0.8.4+commit.c7e474f2</option></select>
        <button type="button" class="workspace-btn primary compile-btn">Compile README.sol</button>
        <div class="compile-result" id="compile-result" hidden></div>
      </div>

      <div class="plugin-content" data-content="udapp">
        <div class="plugin-header"><h3>DEPLOY &amp; RUN TRANSACTIONS</h3></div>
        <label class="field-label">ENVIRONMENT</label>
        <select class="field-select" disabled><option>Injected Provider - MetaMask</option></select>
        <label class="field-label">ACCOUNT</label>
        <select class="field-select" disabled><option id="account-option">0x476a…E2E2</option></select>
        <label class="field-label">CONTRACT</label>
        <select class="field-select" disabled><option>ExampleContract</option></select>
        <button type="button" class="btn-deploy" id="btn-secure-deploy">🛡️ Secure Deploy</button>
        <div class="deploy-result" id="deploy-result" hidden></div>
        <p class="deployed-label">DEPLOYED CONTRACTS</p>
        <div class="address-row">
          <input type="text" class="field-input" placeholder="Contract Address" id="load-address" />
          <button type="button" class="btn-at" id="btn-at-address">At Address</button>
        </div>
        <div class="contract-card">
          <div class="card-head">
            <div>
              <div class="card-name">ExampleContract</div>
              <div class="card-addr" id="display-contract-addr">0x476a…E2E2</div>
            </div>
            <button
              type="button"
              class="btn-copy-addr"
              id="copy-contract-addr"
              data-wallet="0x476ac0C9cdecab9d2F176F873c0cdc0DAD9CE2E2"
            >📋 Copy Address</button>
          </div>
          <button type="button" class="btn-orange" data-action="start">Start</button>
          <button type="button" class="btn-orange" data-action="withdraw">Withdraw</button>
          <button type="button" class="btn-blue" data-action="balance">Get Balance</button>
        </div>
      </div>

      <div class="plugin-content" data-content="debugger">
        <div class="plugin-header"><h3>DEBUGGER</h3></div>
        <p class="muted-text">No active debugging session.</p>
      </div>

      <div class="plugin-content" data-content="settings">
        <div class="plugin-header"><h3>SETTINGS</h3></div>
        <p class="muted-text">Theme: Dark</p>
      </div>
    </aside>

    <main class="editor-main">
      <div class="editor-tabs">
        <span class="editor-tab active" id="editor-tab-label">README.sol</span>
      </div>
      <pre class="editor-code" id="editor-code"><code></code></pre>
      <div class="editor-footer" id="editor-footer">Ln 1, Col 1</div>
    </main>
  </div>

  <footer class="ide-terminal">
    <div class="terminal-head">TERMINAL</div>
    <div class="terminal-log" id="terminal-log" role="log"></div>
  </footer>

  <script src="contract.js"></script>
  <script src="ide.js"></script>
</body>
</html>
