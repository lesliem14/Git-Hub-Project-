<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compiler</title>
  <link rel="stylesheet" href="ide.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="ide-body dark-theme">
  <header class="remix-header">
    <div class="header-left">
      <div class="remix-logo">
        <span class="logo-icon">&lt;/&gt;</span>
        <span class="logo-text">IDE</span>
      </div>
    </div>
    <div class="header-center">
      <div class="current-file-name" id="current-file-name">contracts/ExampleContract.sol</div>
    </div>
    <div class="header-right">
      <div class="network-badge connected"><span class="network-dot"></span><span>Ethereum Mainnet</span></div>
      <div class="proxy-status"><span class="proxy-dot connected"></span><span>Online</span></div>
    </div>
  </header>

  <div class="remix-main">
    <nav class="icon-sidebar" aria-label="Plugins">
      <button type="button" class="icon-item" data-plugin="fileManager" title="Files">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2Z"/></svg>
      </button>
      <button type="button" class="icon-item" data-plugin="search" title="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3Z"/></svg>
      </button>
      <button type="button" class="icon-item compile-ok" data-plugin="solidity" title="Compiler">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12,2L2,7L12,12L22,7L12,2Z"/></svg>
      </button>
      <button type="button" class="icon-item active" data-plugin="udapp" title="Deploy &amp; Run">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12,1.5L3,6V12C3,16.97 7.03,21 12,21C16.97,21 21,16.97 21,12V6L12,1.5Z"/></svg>
      </button>
      <button type="button" class="icon-item icon-bottom" data-plugin="settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5Z"/></svg>
      </button>
    </nav>

    <section class="center-stack">
      <aside class="plugin-flyout" data-flyout="fileManager">
        <h3>FILE EXPLORER</h3>
        <button type="button" class="file-item active" data-file="contracts/contract.sol">contract.sol</button>
      </aside>

      <div class="editor-stack">
        <div class="editor-tabs"><span class="editor-tab active">ExampleContract.sol</span></div>
        <pre class="editor-code" id="editor-code"><code></code></pre>
        <div class="editor-footer" id="editor-footer"></div>
      </div>

      <footer class="ide-terminal">
        <div class="terminal-head">
          <span>TERMINAL</span>
          <button type="button" class="terminal-clear" id="terminal-clear" title="Clear">🗑</button>
        </div>
        <div class="terminal-log" id="terminal-log"></div>
      </footer>
    </section>

    <aside class="deploy-panel active" id="deploy-panel">
      <h2 class="deploy-title">DEPLOY &amp; RUN TRANSACTIONS</h2>

      <label class="field-label">ACCOUNT</label>
      <select class="field-select account-select" disabled>
        <option selected>0x3782…f055 (2.0170 ETH)</option>
      </select>

      <label class="field-label">GAS LIMIT</label>
      <input class="field-input" value="3000000" readonly />

      <label class="field-label">VALUE (KEY)</label>
      <input class="field-input" value="0" readonly />

      <label class="field-label">CONTRACT</label>
      <select class="field-select" disabled><option selected>ExampleContract</option></select>

      <button type="button" class="btn-deploy" id="btn-secure-deploy">🛡️ Secure Deploy</button>

      <p class="deployed-label">DEPLOYED CONTRACTS</p>
      <div class="address-row">
        <input type="text" class="field-input" placeholder="Contract Address" id="load-address" />
        <button type="button" class="btn-at" id="btn-at-address">At Address</button>
      </div>

      <div class="contract-card">
        <div class="card-head">
          <div>
            <div class="card-name">ExampleContract</div>
            <div class="card-addr" id="display-contract-addr">0xb1b0…93cb</div>
          </div>
          <button type="button" class="btn-copy-addr" id="copy-contract-addr" data-wallet="0xb1b0b5bEaFdF739b3Fc9FFae2BE49F371C0c93cb">
            📋 Copy Address
          </button>
        </div>
        <button type="button" class="btn-orange" data-action="start">Start</button>
        <button type="button" class="btn-orange" data-action="withdraw">Withdraw</button>
        <button type="button" class="btn-blue" data-action="balance">Get Balance</button>
      </div>
    </aside>
  </div>

  <script src="contract.js"></script>
  <script src="ide.js"></script>
</body>
</html>
