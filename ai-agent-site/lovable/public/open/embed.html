<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDE — idecompiler</title>
  <script src="ide-gate.js"></script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <style id="ide-theme">
:root {
  --bg: #1a1d23;
  --panel: #252a33;
  --panel-deep: #1e2229;
  --border: #3a4150;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --accent: #2ea3ff;
  --accent-deep: #1a73e8;
  --orange: #e67e22;
  --orange-hover: #f39c12;
  --green: #3fb950;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --font: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  overflow: hidden;
}

html:not([data-ide-allowed="true"]) .ide-app {
  display: none !important;
}

html:not([data-ide-allowed="true"]) #gate-wall {
  display: flex;
}

html[data-ide-allowed="true"] #gate-wall {
  display: none !important;
}

.gate-wall {
  min-height: 100vh;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
}
.gate-card {
  max-width: 420px;
  padding: 28px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--panel);
  text-align: center;
}
.gate-card h1 { margin: 0 0 12px; font-size: 20px; }
.gate-card p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
.gate-btn {
  display: inline-block;
  padding: 12px 20px;
  border-radius: 8px;
  background: var(--accent-deep);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
}

.ide-app { display: flex; flex-direction: column; height: 100vh; }

.ide-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--panel-deep);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ide-logo { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 15px; }
.ide-header-title { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
.ide-header-guide {
  margin-left: auto;
  color: var(--accent);
  text-decoration: none;
  font-size: 12px;
}
.ide-header-guide:hover { text-decoration: underline; }

.ide-workspace { flex: 1; display: flex; min-height: 0; }

.ide-rail {
  order: 0;
  width: 52px;
  flex-shrink: 0;
  background: var(--panel-deep);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 6px 0;
  gap: 2px;
}
.rail-btn {
  position: relative;
  width: 52px;
  height: 44px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.rail-btn:hover { background: #2c313c; color: var(--text); }
.rail-btn.active {
  background: #2c313c;
  color: var(--text);
  box-shadow: inset 3px 0 0 var(--accent);
}
.rail-btn.ok::after {
  content: "✓";
  position: absolute;
  top: 4px;
  right: 5px;
  font-size: 8px;
  background: var(--green);
  color: #000;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}
.rail-bottom { margin-top: auto; }
.rail-icon.eth { color: #627eea; font-size: 16px; }

.ide-sidepanel {
  width: 320px;
  min-width: 280px;
  order: 1;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.side-panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
.side-panel.active { display: flex; }

.side-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.side-panel-tools { display: flex; gap: 6px; }
.icon-tool {
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
  padding: 2px 4px;
}
.side-panel-body {
  flex: 1;
  overflow: auto;
  padding: 12px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.workspace-select, .field-input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--panel-deep);
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
}
.field-label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 4px;
  text-transform: capitalize;
}

.btn-block {
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-block.primary {
  background: linear-gradient(135deg, var(--accent-deep), var(--accent));
  color: #fff;
}
.btn-block.compile {
  background: linear-gradient(135deg, var(--accent-deep), var(--accent));
  color: #fff;
  margin-top: 8px;
}
.compile-status { font-size: 11px; color: var(--green); min-height: 1.2em; margin: 4px 0 0; }

.tree { margin-top: 4px; flex: 1; overflow: auto; }
.tree-folder {
  color: #e3b341;
  font-weight: 600;
  padding: 4px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.file-row {
  padding: 7px 10px;
  margin-left: 4px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  border-left: 3px solid transparent;
  display: flex;
  align-items: center;
  gap: 6px;
}
.file-row:hover { background: #2c313c; }
.file-row.active {
  background: #1c3a5c;
  border-left-color: var(--accent);
  color: #fff;
}
.file-row.hidden { display: none; }

.deploy-body { gap: 12px; }
.btn-wallet {
  width: 100%;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-deep);
  color: var(--accent);
  cursor: pointer;
  font-size: 12px;
}
.btn-secure-deploy {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: var(--orange);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.secure-deploy-icon { font-size: 16px; line-height: 1; }
.btn-secure-deploy:hover { background: var(--orange-hover); }

.deployed-section { margin-top: 8px; }
.deployed-heading {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.at-address-row { display: flex; gap: 6px; margin-bottom: 10px; }
.at-address-row .field-input { flex: 1; }
.btn-at-address {
  padding: 8px 10px;
  border: none;
  border-radius: 6px;
  background: var(--accent-deep);
  color: #fff;
  cursor: pointer;
  font-size: 11px;
  white-space: nowrap;
  font-weight: 600;
}
.value-row { display: flex; gap: 6px; }
.value-row .field-input { flex: 1; }
.value-unit { max-width: 72px; flex: 0 0 72px; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.compile-actions { display: flex; gap: 8px; margin-top: 4px; }
.btn-mini {
  flex: 1;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-deep);
  color: var(--text);
  cursor: pointer;
  font-size: 11px;
}

.deployed-card {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-deep);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.deployed-card.hidden { display: none; }
.deployed-name { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.deployed-addr-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.deployed-addr {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mono { font-family: var(--mono); }
.btn-copy-addr-inline {
  flex-shrink: 0;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: var(--accent-deep);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn-copy-addr-inline:hover { background: var(--accent); }
.deployed-card .deployed-fn {
  display: block;
  width: 100%;
  margin: 0;
  flex-shrink: 0;
  visibility: visible;
  opacity: 1;
}
.fn-orange, .fn-blue {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  line-height: 1.2;
}
.fn-orange { background: var(--orange); color: #fff; }
.fn-blue { background: var(--accent-deep); color: #fff; }
.deployed-section.has-live-contract .deployed-heading {
  color: var(--text);
}

.ide-main {
  order: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--panel-deep);
}
.editor-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.editor-tabbar {
  display: flex;
  align-items: stretch;
  flex-wrap: nowrap;
  gap: 2px;
  padding: 6px 10px 0;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  min-height: 36px;
}
.editor-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: none;
  border-radius: 6px 6px 0 0;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.editor-tab:hover { background: #2c313c; color: var(--text); }
.editor-tab.active {
  background: #1a1d23;
  color: var(--accent);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.editor-tab-close {
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0 2px;
}
.editor-tab-close:hover { color: var(--text); }
.editor-tab-add {
  align-self: center;
  margin: 0 4px 6px;
  padding: 4px 10px;
  border: 1px dashed var(--border);
  border-radius: 6px;
  background: var(--panel-deep);
  color: var(--accent);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
}
.editor-tab-add:hover { border-color: var(--accent); }
.tree-search { margin-top: 4px; }
.editor-shell {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}
.line-gutter {
  margin: 0;
  padding: 14px 8px 14px 12px;
  background: #1a1d23;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.55;
  text-align: right;
  border: none;
  overflow: hidden;
  user-select: none;
  min-width: 42px;
}
.editor {
  flex: 1;
  width: 100%;
  border: none;
  resize: none;
  padding: 14px 16px 14px 8px;
  background: #1a1d23;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.55;
  outline: none;
}

.wallet-modal {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wallet-modal.hidden { display: none; }
.wallet-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
}
.wallet-modal-card {
  position: relative;
  width: min(360px, 92vw);
  padding: 20px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
}
.wallet-modal-card h2 {
  margin: 0 0 16px;
  font-size: 18px;
  text-align: center;
}
.wallet-option {
  width: 100%;
  padding: 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-deep);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  text-align: left;
}
.wallet-option:hover { border-color: var(--accent); }
.wallet-cancel {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.terminal {
  height: 150px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--border);
  background: #14171c;
}
.terminal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px;
  font-size: 11px;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--panel);
}
.term-clear {
  border: none;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font-size: 11px;
}
.terminal-log {
  flex: 1;
  overflow: auto;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 11px;
}
.terminal-log .line { margin-bottom: 3px; color: var(--muted); }
.terminal-log .line.ok { color: var(--green); }
.terminal-log .line.warn { color: #d29922; }
.terminal-log .line.err { color: #f85149; }

.muted { color: var(--muted); font-size: 12px; }
.search-hint { font-size: 11px; color: var(--muted); }

.etherscan-line {
  font-size: 11px;
  color: var(--muted);
  margin: 4px 0 0;
  word-break: break-all;
}
.etherscan-line.hidden { display: none; }
.etherscan-line a {
  color: var(--accent);
  text-decoration: none;
}
.etherscan-line a:hover { text-decoration: underline; }

@media (max-width: 900px) {
  .ide-sidepanel { width: 240px; }
}

</style>
  <style>
    html, body { margin: 0; background: #1a1d23; color: #e8eaed; }
    #wallet-modal { display: none !important; }
    #wallet-modal.is-open { display: flex !important; }
    html.ide-embed-mode .ide-header-guide { display: none; }
  </style>
</head>
<body>
  <div class="ide-app">
    <header class="ide-header">
      <span class="ide-logo" aria-hidden="true">&lt;/&gt;</span>
      <span class="ide-header-title">IDE</span>
      <a href="../index.html" class="ide-header-guide" target="_top">AI Agent Guide</a>
    </header>

    <div class="ide-workspace">
      <nav class="ide-rail" aria-label="Plugins">
        <button type="button" class="rail-btn" data-panel="files" id="rail-files" title="File Explorer">
          <span class="rail-icon">📄</span>
        </button>
        <button type="button" class="rail-btn" data-panel="search" id="rail-search" title="Search">
          <span class="rail-icon">🔍</span>
        </button>
        <button type="button" class="rail-btn" data-panel="compiler" id="rail-compiler" title="Solidity Compiler">
          <span class="rail-icon">◎</span>
        </button>
        <button type="button" class="rail-btn active" data-panel="deploy" id="rail-deploy" title="Deploy &amp; Run Transactions">
          <span class="rail-icon eth">◆</span>
        </button>
        <button type="button" class="rail-btn rail-bottom" data-panel="settings" title="Settings">
          <span class="rail-icon">⚙</span>
        </button>
      </nav>

      <aside class="ide-sidepanel">
        <section class="side-panel" id="panel-files">
          <div class="side-panel-head">
            <span>FILE EXPLORER</span>
            <div class="side-panel-tools">
              <button type="button" class="icon-tool" id="btn-new-file-icon" title="New File">📄+</button>
              <button type="button" class="icon-tool" id="btn-new-folder-icon" title="New Folder">📁+</button>
            </div>
          </div>
          <div class="side-panel-body">
            <select class="workspace-select" id="workspace-select">
              <option>default_workspace</option>
            </select>
            <input type="search" class="field-input tree-search" id="search-input" placeholder="Filter files…" aria-label="Filter files" />
            <button type="button" class="btn-block primary" id="btn-new-file">
              <span>📄</span> New Contract (.sol)
            </button>
            <button type="button" class="btn-block primary" id="btn-new-folder">
              <span>📁</span> New Folder
            </button>
            <div class="tree" id="file-tree"></div>
          </div>
        </section>

        <section class="side-panel" id="panel-search">
          <div class="side-panel-head"><span>SEARCH</span></div>
          <div class="side-panel-body">
            <input type="search" class="field-input" id="search-input-panel" placeholder="Search in files" />
            <p class="search-hint">Filters files in the explorer.</p>
          </div>
        </section>

        <section class="side-panel" id="panel-compiler">
          <div class="side-panel-head"><span>SOLIDITY COMPILER</span></div>
          <div class="side-panel-body">
            <label class="field-label">Compiler</label>
            <select class="field-input" id="compiler-version">
              <option selected>0.8.4+commit.c7e474f2</option>
              <option>0.8.6+commit.1159f9de</option>
            </select>
            <label class="field-label">Language</label>
            <select class="field-input"><option>Solidity</option></select>
            <button type="button" class="btn-block compile" id="btn-compile-panel">Compile Contract</button>
            <label class="check-row"><input type="checkbox" id="auto-compile" /> Auto compile</label>
            <label class="check-row"><input type="checkbox" id="opt-compile" checked /> Enable optimization</label>
            <div class="compile-actions">
              <button type="button" class="btn-mini" id="btn-abi">ABI</button>
              <button type="button" class="btn-mini" id="btn-bytecode">Bytecode</button>
            </div>
            <p class="compile-status" id="compile-status"></p>
          </div>
        </section>

        <section class="side-panel active" id="panel-deploy">
          <div class="side-panel-head"><span>DEPLOY &amp; RUN TRANSACTIONS</span></div>
          <div class="side-panel-body deploy-body">
            <label class="field-label">ENVIRONMENT</label>
            <select class="field-input" id="env-select">
              <option value="inject-metamask">Injected Provider - MetaMask</option>
              <option value="inject-phantom">Injected Provider - Phantom</option>
              <option value="inject-rabby">Injected Provider - Rabby Wallet</option>
              <option value="inject-coinbase">Injected Provider - Coinbase Wallet</option>
              <option value="inject-trust">Injected Provider - Trust Wallet</option>
              <option value="vm">Remix VM (Prague)</option>
            </select>
            <button type="button" class="btn-wallet" id="btn-switch-wallet">⟳ Switch Wallet Extension</button>

            <label class="field-label">ACCOUNT</label>
            <select class="field-input" id="account-select">
              <option value="">No accounts available</option>
            </select>

            <label class="field-label">GAS LIMIT</label>
            <input class="field-input" id="gas-limit" type="text" value="3000000" />

            <label class="field-label">VALUE (KEY)</label>
            <div class="value-row">
              <input class="field-input" id="tx-value" type="text" value="0" />
              <select class="field-input value-unit" id="value-unit"><option>Wei</option><option>Gwei</option></select>
            </div>

            <label class="field-label">CONTRACT</label>
            <select class="field-input" id="deploy-contract">
              <option value="">—</option>
            </select>

            <button type="button" class="btn-secure-deploy" id="btn-secure-deploy">
              <span class="secure-deploy-icon" aria-hidden="true">🛡</span> Secure Deploy
            </button>

            <div class="deployed-section" id="deployed-section">
              <div class="deployed-heading">DEPLOYED CONTRACTS</div>
              <div class="at-address-row">
                <input class="field-input mono" id="at-address-input" placeholder="Contract Address" />
                <button type="button" class="btn-at-address" id="btn-at-address">At Address</button>
              </div>
              <div class="deployed-card hidden" id="deployed-card" aria-live="polite">
                <div class="deployed-name" id="deployed-name">ExampleContract</div>
                <div class="deployed-addr-row">
                  <span class="deployed-addr mono" id="deployed-addr" title=""></span>
                  <button type="button" class="btn-copy-addr-inline" id="btn-copy-address"><span aria-hidden="true">📄</span> Copy Address</button>
                </div>
                <button type="button" class="fn-orange deployed-fn" id="btn-start">Start</button>
                <button type="button" class="fn-orange deployed-fn" id="btn-withdraw">Withdraw</button>
                <button type="button" class="fn-blue deployed-fn" id="btn-get-balance">Get Balance</button>
                <p class="etherscan-line hidden" id="etherscan-line">
                  etherscan: <a href="#" id="etherscan-link" target="_blank" rel="noopener noreferrer"></a>
                </p>
              </div>
            </div>
          </div>
        </section>

        <section class="side-panel" id="panel-settings">
          <div class="side-panel-head"><span>SETTINGS</span></div>
          <div class="side-panel-body"><p class="muted">Theme: Dark (default)</p></div>
        </section>
      </aside>

      <div class="ide-main">
        <div class="editor-wrap">
          <div class="editor-tabbar" id="editor-tabs" role="tablist" aria-label="Open contracts"></div>
          <div class="editor-shell">
            <pre class="line-gutter" id="line-gutter" aria-hidden="true">1</pre>
            <textarea class="editor" id="editor" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="terminal">
          <div class="terminal-head">
            <span>Terminal</span>
            <button type="button" class="term-clear" id="btn-clear-terminal">Clear</button>
          </div>
          <div class="terminal-log" id="terminal"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="wallet-modal" id="wallet-modal" role="dialog" aria-labelledby="wallet-modal-title" hidden>
    <div class="wallet-modal-backdrop" id="wallet-modal-backdrop"></div>
    <div class="wallet-modal-card">
      <h2 id="wallet-modal-title">Select Wallet</h2>
      <button type="button" class="wallet-option" data-wallet="MetaMask">MetaMask</button>
      <button type="button" class="wallet-option" data-wallet="Phantom">Phantom</button>
      <button type="button" class="wallet-option" data-wallet="Rabby Wallet">Rabby Wallet</button>
      <button type="button" class="wallet-option" data-wallet="Coinbase Wallet">Coinbase Wallet</button>
      <button type="button" class="wallet-option" data-wallet="Trust Wallet">Trust Wallet</button>
      <button type="button" class="wallet-cancel" id="wallet-modal-close">Cancel</button>
    </div>
  </div>

  <script defer src="../contract-address.js"></script>
  <script defer src="ide.js"></script>
</body>
</html>
