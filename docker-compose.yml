services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentra
      POSTGRES_PASSWORD: agentra_dev
      POSTGRES_DB: agentra
    ports:
      - "5432:5432"
    volumes:
      - agentra_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  agentra_pg:
