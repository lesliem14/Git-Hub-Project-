apiVersion: batch/v1
kind: CronJob
metadata:
  name: sentiment-sweep-hourly
  namespace: sentiment-sweep
  labels:
    app.kubernetes.io/name: sentiment-sweep
    app.kubernetes.io/component: cron
spec:
  schedule: "0 * * * *"
  timeZone: "Africa/Johannesburg"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sentiment-sweep
            app.kubernetes.io/component: sweep-job
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: sweep
              image: YOUR_REGISTRY/sentiment-sweep:latest
              imagePullPolicy: Always
              command: ["python", "main.py", "sweep"]
              envFrom:
                - secretRef:
                    name: sentiment-sweep-env
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /app/data
                - name: output
                  mountPath: /app/output
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: sentiment-sweep-data
            - name: output
              persistentVolumeClaim:
                claimName: sentiment-sweep-output
