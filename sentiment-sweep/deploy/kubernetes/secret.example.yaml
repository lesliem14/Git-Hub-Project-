# Copy to secret.yaml, fill values, apply once. Prefer External Secrets / Azure Key Vault / AWS SM in production.
apiVersion: v1
kind: Secret
metadata:
  name: sentiment-sweep-env
  namespace: sentiment-sweep
type: Opaque
stringData:
  META_PAGE_ACCESS_TOKEN: ""
  META_PAGE_ID: ""
  META_IG_USER_ID: ""
  HELLOPETER_MODE: "email"
  HELLOPETER_IMAP_HOST: ""
  HELLOPETER_IMAP_USER: ""
  HELLOPETER_IMAP_PASSWORD: ""
  POLICY_REGEX: "(?i)\\b(?:POL|CLT)[-\\s]?\\d{6,12}\\b"
  ANTHROPIC_API_KEY: ""
  TEAMS_WEBHOOK_URL: ""
  DATABASE_PATH: "/app/data/sweep.db"
  EXCEL_OUTPUT_DIR: "/app/output"
